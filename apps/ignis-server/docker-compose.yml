services:
  ignis:
    build:
      context: ../..
      dockerfile: apps/ignis-server/Dockerfile
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      IGNIS_PASSWORD_FILE: /run/secrets/ignis_password
      IGNIS_PUBLIC_ORIGIN: ${IGNIS_PUBLIC_ORIGIN:-http://localhost:8082}
    secrets:
      - ignis_password
    volumes:
      - ./vaults:/vaults
      - ./data:/app/data
      - obsidian-app:/app/obsidian-app
    restart: unless-stopped

volumes:
  obsidian-app:

secrets:
  ignis_password:
    file: ./.ignis-secrets/password
